name: Rebuild research layer

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'entities/**'
      - 'topics/**'
      - 'relationships/**'
      - 'sources/**'
      - 'config/entity-candidate-ignore.txt'
      - 'requirements.txt'
      - 'scripts/sync_microblog.py'
      - 'scripts/rebuild_post_inventory.py'
      - 'scripts/build_research.py'
      - 'scripts/disambiguate_mentions.py'
      - 'scripts/discover_candidates.py'
      - 'scripts/audit_entity_quality.py'
      - 'scripts/enrich_citation_titles.py'
      - 'scripts/generate_link_health.py'
      - 'scripts/add_resolved_link_health.py'
      - 'scripts/generate_commons.py'
      - 'scripts/apply_citation_titles.py'
      - 'schemas/commons-v1.schema.json'
      - '.github/workflows/rebuild-research.yml'

concurrency:
  group: southall-zettel-research-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Sync live Southall Stories posts
        env:
          MICROBLOG_TOKEN: ${{ secrets.MICROBLOG_TOKEN }}
          MICROBLOG_HOSTS: southallstories.uk,www.southallstories.uk,southall.micro.blog
        run: python scripts/sync_microblog.py
      - name: Rebuild post inventory
        run: python scripts/rebuild_post_inventory.py
      - name: Discover candidate entities
        run: python scripts/discover_candidates.py
      - name: Build reviewed research graph
        run: python scripts/build_research.py
      - name: Disambiguate ambiguous entity mentions
        run: python scripts/disambiguate_mentions.py
      - name: Audit entity completeness and description quality
        run: python scripts/audit_entity_quality.py
      - name: Enrich article citations and check links
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]]; then
            LINK_HEALTH_FULL=1 python scripts/enrich_citation_titles.py
          else
            python scripts/enrich_citation_titles.py
          fi
      - name: Build Civic Commons export
        run: python scripts/generate_commons.py
      - name: Apply citation destination titles
        run: python scripts/apply_citation_titles.py
      - name: Preserve previous link health report
        run: cp generated/link-health.json /tmp/link-health-previous.json 2>/dev/null || true
      - name: Build link health report
        run: |
          python scripts/generate_link_health.py
          python scripts/add_resolved_link_health.py /tmp/link-health-previous.json
      - name: Validate Commons JSON
        run: |
          python -m json.tool generated/commons.json > /dev/null
          python -m json.tool generated/link-health.json > /dev/null
          python -m json.tool generated/entity-quality.json > /dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          import jsonschema

          schema = json.loads(Path('schemas/commons-v1.schema.json').read_text(encoding='utf-8'))
          data = json.loads(Path('generated/commons.json').read_text(encoding='utf-8'))
          jsonschema.Draft202012Validator(schema).validate(data)
          print('Commons export validates against schema v1')
          PY
      - name: Notify newly actionable links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && -f generated/link-health-alert.md ]]; then
            gh issue create --title "Link health: newly actionable Southall Stories sources" --body-file generated/link-health-alert.md
          else
            echo "No scheduled link-health notification needed."
          fi
      - name: Email newly actionable links
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "schedule" || ! -f generated/link-health-alert.md ]]; then
            echo "No scheduled link-health email needed."
            exit 0
          fi
          if [[ -z "$RESEND_API_KEY" ]]; then
            echo "RESEND_API_KEY is not configured; skipping email alert."
            exit 0
          fi
          jq -n \
            --arg from "Civic Commons <alerts@mail.commons.southallstories.uk>" \
            --arg to "dmarsd@gmail.com" \
            --arg subject "Southall Stories link health: new links need attention" \
            --rawfile text generated/link-health-alert.md \
            '{from:$from,to:[$to],subject:$subject,text:$text}' > /tmp/resend-link-health.json
          curl --fail-with-body --silent --show-error \
            https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/resend-link-health.json
      - name: Commit refreshed corpus and research layer
        run: |
          git add posts generated indexes
          if git diff --cached --quiet; then
            echo 'Corpus and research layer already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync Southall Stories and rebuild research layer'
          git push
