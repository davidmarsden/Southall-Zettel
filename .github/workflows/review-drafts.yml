name: Review Southall Stories drafts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'posts/drafts/**'
      - 'entities/**'
      - 'generated/citation-metadata.json'
      - 'scripts/review_drafts.py'
      - '.github/workflows/review-drafts.yml'

concurrency:
  group: southall-zettel-draft-review-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Review drafts
        run: python scripts/review_drafts.py
      - name: Commit draft review reports
        run: |
          git add generated/draft-review generated/draft-review.json indexes/draft-review.md
          if git diff --cached --quiet; then
            echo 'Draft review reports already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Southall Stories draft review reports'
          git push
