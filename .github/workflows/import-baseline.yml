name: Import Southall Stories baseline

on:
  push:
    paths:
      - '.staging/READY'

permissions:
  contents: write

jobs:
  import-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair and verify exact baseline archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, subprocess

          target = '7c34203eb9aa4d7c965327e82d6c9eaf8f9b3b651292b1b4c07b83d62eecb867'
          root = Path('.staging')

          def show(path: str) -> str:
              return subprocess.check_output(['git', 'show', f'origin/canonical-recovery:{path}'], text=True)

          def compact(s: str) -> str:
              return ''.join(s.split())

          names = [f'chunk-{i:03d}' for i in range(17)] + [
              'chunk-017-00', 'chunk-017-01', 'chunk-017-02',
              'chunk-018-00', 'chunk-018-01', 'chunk-018-02',
              'chunk-019-00',
          ]
          b64 = ''.join((root / n).read_text().strip() for n in names)
          prefix = base64.b64decode(b64, validate=True)
          tail = bytes.fromhex(''.join((root / f'hex-{i:02d}').read_text() for i in range(7)))
          candidate = bytearray(prefix + tail)
          print('staged candidate', len(candidate), hashlib.sha256(candidate).hexdigest())
          assert len(candidate) == 236480, len(candidate)

          # Rebuild canonical first 40 KB. Every source part should be exactly
          # 10,000 hex chars. hex-04 acquired one extra relay character; remove
          # it only if doing so exactly matches the independent staged byte range.
          hex_parts = []
          for i in range(8):
              h = compact(show(f'.fresh/hex-{i:02d}'))
              print(f'hex-{i:02d} compact chars', len(h))
              if i == 4 and len(h) == 10001:
                  ref = bytes(candidate[20000:25000]).hex()
                  repaired = None
                  repair_at = None
                  # Fast path: locate the first shift against the 10,000-char reference.
                  j = 0
                  while j < len(ref) and h[j] == ref[j]:
                      j += 1
                  for pos in {j, max(0, j-1), min(10000, j+1), 10000}:
                      trial = h[:pos] + h[pos+1:]
                      if trial == ref:
                          repaired, repair_at = trial, pos
                          break
                  # Exhaustive fallback is still tiny (10k candidates).
                  if repaired is None:
                      for pos in range(len(h)):
                          if h[:pos] + h[pos+1:] == ref:
                              repaired, repair_at = h[:pos] + h[pos+1:], pos
                              break
                  if repaired is None:
                      raise SystemExit('hex-04 has 10001 chars but no single deletion matches staged reference')
                  print('hex-04 repaired single inserted char at', repair_at)
                  h = repaired
              if len(h) != 10000:
                  raise SystemExit(f'Unexpected canonical hex-{i:02d} length {len(h)}')
              hex_parts.append(h)

          first = bytes.fromhex(''.join(hex_parts))
          assert len(first) == 40000
          candidate[:40000] = first

          # tail-00..10: exact 14,000-hex-char slices at byte 40,000 onward.
          pos = 40000
          for i in range(11):
              h = compact(show(f'.fresh/tail-{i:02d}'))
              print(f'tail-{i:02d} compact chars', len(h), 'at byte', pos)
              if len(h) != 14000:
                  raise SystemExit(f'Unexpected tail-{i:02d} length {len(h)}')
              part = bytes.fromhex(h)
              candidate[pos:pos+7000] = part
              pos += 7000
          assert pos == 117000

          # tail-11 is a surviving canonical prefix of the intended 14k hex slice.
          h11 = compact(show('.fresh/tail-11'))
          print('tail-11 compact chars', len(h11), 'at byte 117000')
          if len(h11) % 2:
              raise SystemExit('tail-11 surviving prefix has odd hex length')
          part11 = bytes.fromhex(h11)
          candidate[117000:117000+len(part11)] = part11

          # tail-12..21: exact 14k slices at their original fixed offsets.
          for i in range(12, 22):
              h = compact(show(f'.fresh/tail-{i:02d}'))
              print(f'tail-{i:02d} compact chars', len(h))
              if len(h) != 14000:
                  raise SystemExit(f'Unexpected tail-{i:02d} length {len(h)}')
              part = bytes.fromhex(h)
              intended = 124000 + (i - 12) * 7000
              candidate[intended:intended+7000] = part

          repaired = bytes(candidate)
          h = hashlib.sha256(repaired).hexdigest()
          print('repaired candidate', len(repaired), h)
          if h != target:
              print('Still-unknown windows: bytes 122000:124000 and 194000:236480')
              raise SystemExit('Canonical overlay did not yet recover the target SHA-256')

          Path('/tmp/Southall-Zettel-baseline-full.tar.xz').write_bytes(repaired)
          print('RECOVERED exact original archive')
          PY
          echo '7c34203eb9aa4d7c965327e82d6c9eaf8f9b3b651292b1b4c07b83d62eecb867  /tmp/Southall-Zettel-baseline-full.tar.xz' | sha256sum -c -
          xz -t /tmp/Southall-Zettel-baseline-full.tar.xz

      - name: Unpack and verify corpus
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/Southall-Zettel-baseline-full.tar.xz
          test "$(find posts -type f -name '*.md' | wc -l)" -eq 69
          test -f generated/posts.json
          test -f indexes/years.md
          test -f indexes/categories.md
          test -f indexes/sources.md
          test -f original/baseline-2026-08-27.json
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          records = json.loads(Path('generated/posts.json').read_text())
          assert len(records) == 69, len(records)
          for record in records:
              p = Path(record['path'])
              assert p.is_file(), p
              actual = hashlib.sha256(p.read_bytes()).hexdigest()
              assert actual == record['sha256'], (p, actual, record['sha256'])
          print('Verified 69 post files against generated/posts.json SHA-256 manifest')
          PY

      - name: Commit corpus and clean bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .staging .fresh .bootstrap
          rm -f .github/workflows/import-baseline.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Southall Stories baseline corpus (2026-08-27)'
          git push origin HEAD:main
