name: Import Southall Stories baseline corpus

on:
  push:
    paths:
      - '.staging/READY'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct baseline archive
        shell: bash
        run: |
          set -euo pipefail
          cat .staging/chunk-* > /tmp/southall-zettel-baseline.b64
          base64 --decode /tmp/southall-zettel-baseline.b64 > /tmp/southall-zettel-baseline.zip
          mkdir -p /tmp/southall-zettel-baseline
          unzip -q /tmp/southall-zettel-baseline.zip -d /tmp/southall-zettel-baseline
          cp -a /tmp/southall-zettel-baseline/. .

      - name: Commit imported corpus and remove staging files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .staging
          rm -f .github/workflows/import-baseline.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Southall Stories baseline corpus (2026-08-27)"
          git push
