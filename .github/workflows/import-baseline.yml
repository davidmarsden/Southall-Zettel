name: Import Southall Stories baseline

on:
  push:
    paths:
      - '.staging/READY'

permissions:
  contents: write

jobs:
  import-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair and verify exact baseline archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, subprocess

          target = '7c34203eb9aa4d7c965327e82d6c9eaf8f9b3b651292b1b4c07b83d62eecb867'
          root = Path('.staging')

          def show(path: str) -> str:
              return subprocess.check_output(
                  ['git', 'show', f'origin/canonical-recovery:{path}'],
                  text=True,
              )

          names = [f'chunk-{i:03d}' for i in range(17)] + [
              'chunk-017-00', 'chunk-017-01', 'chunk-017-02',
              'chunk-018-00', 'chunk-018-01', 'chunk-018-02',
              'chunk-019-00',
          ]
          b64 = ''.join((root / n).read_text().strip() for n in names)
          prefix = base64.b64decode(b64, validate=True)
          tail = bytes.fromhex(''.join((root / f'hex-{i:02d}').read_text() for i in range(7)))
          candidate = bytearray(prefix + tail)
          print('staged candidate', len(candidate), hashlib.sha256(candidate).hexdigest())
          assert len(candidate) == 236480, len(candidate)

          # Canonical stream layout created from the verified original archive:
          # hex-00..07 = first 80,000 hex chars = bytes 0..39,999.
          first = bytes.fromhex(''.join(show(f'.fresh/hex-{i:02d}') for i in range(8)))
          print('canonical first', len(first))
          candidate[0:len(first)] = first

          # tail-00..10 are consecutive 14,000-hex-char slices beginning at
          # hex offset 80,000, i.e. byte offset 40,000.
          pos = 40000
          for i in range(11):
              part = bytes.fromhex(show(f'.fresh/tail-{i:02d}'))
              print(f'tail-{i:02d}', len(part), 'at', pos)
              candidate[pos:pos+len(part)] = part
              pos += 7000
          assert pos == 117000, pos

          # tail-11 was truncated during relay, but its surviving prefix is still
          # canonical. Overlay whatever exact bytes survived at byte 117,000.
          part11 = bytes.fromhex(show('.fresh/tail-11'))
          print('tail-11 surviving', len(part11), 'at 117000')
          candidate[117000:117000+len(part11)] = part11

          # tail-12..21 were generated from fixed original offsets, independently
          # of the truncated tail-11 relay, so restore them at their intended slots.
          for i in range(12, 22):
              part = bytes.fromhex(show(f'.fresh/tail-{i:02d}'))
              intended = 124000 + (i - 12) * 7000
              print(f'tail-{i:02d}', len(part), 'at', intended)
              candidate[intended:intended+len(part)] = part

          repaired = bytes(candidate)
          h = hashlib.sha256(repaired).hexdigest()
          print('repaired', len(repaired), h)
          if h != target:
              # Give a bounded diagnostic of the still-unknown regions.
              print('UNKNOWN regions remain approximately bytes 122000:124000 and 194000:236480')
              raise SystemExit('Canonical overlay did not yet recover the target SHA-256')

          out = Path('/tmp/Southall-Zettel-baseline-full.tar.xz')
          out.write_bytes(repaired)
          print('RECOVERED exact original archive')
          PY
          echo '7c34203eb9aa4d7c965327e82d6c9eaf8f9b3b651292b1b4c07b83d62eecb867  /tmp/Southall-Zettel-baseline-full.tar.xz' | sha256sum -c -
          xz -t /tmp/Southall-Zettel-baseline-full.tar.xz

      - name: Unpack and verify corpus
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf /tmp/Southall-Zettel-baseline-full.tar.xz
          test "$(find posts -type f -name '*.md' | wc -l)" -eq 69
          test -f generated/posts.json
          test -f indexes/years.md
          test -f indexes/categories.md
          test -f indexes/sources.md
          test -f original/baseline-2026-08-27.json
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          records = json.loads(Path('generated/posts.json').read_text())
          assert len(records) == 69, len(records)
          for record in records:
              p = Path(record['path'])
              assert p.is_file(), p
              actual = hashlib.sha256(p.read_bytes()).hexdigest()
              assert actual == record['sha256'], (p, actual, record['sha256'])
          print('Verified 69 post files against generated/posts.json SHA-256 manifest')
          PY

      - name: Commit corpus and clean bootstrap files
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .staging .fresh .bootstrap
          rm -f .github/workflows/import-baseline.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add Southall Stories baseline corpus (2026-08-27)'
          git push origin HEAD:main
